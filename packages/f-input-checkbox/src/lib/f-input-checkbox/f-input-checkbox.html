<div class="custom-control custom-checkbox">
  @if (mode === 'input') {
    <input
      type="checkbox"
      class="custom-control-input"
      [id]="id"
      [checked]="value"
      [disabled]="disabled"
      [tabIndex]="tabIndex"
      [attr.readonly]="readonly || null"
      (change)="onCheckboxChange($event.target)"
    />
    <label class="custom-control-label" [attr.for]="id">{{ label }}</label>
    @if (!isValid && invalidFeedback) {
      <div class="invalid-feedback d-block">{{ invalidFeedback }}</div>
    }
  } @else {
    <span>{{ value ? 'Yes' : 'No' }}</span>
  }
</div>
