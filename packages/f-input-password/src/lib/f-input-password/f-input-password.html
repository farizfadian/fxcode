<span class="f-input-wrapper">
  @if (label) {
    <label [attr.for]="id">{{ label }}</label>
  }
  @if (mode === 'input') {
    @if (icon) {
      <i [class]="icon" class="icon-left btn-icon"></i>
    }
    <input
      [type]="type"
      [id]="id"
      [class]="class"
      [class.form-control]="!class"
      [class.is-invalid]="!isValid && value"
      [class.form-control-sm]="size === 'sm'"
      [class.form-control-lg]="size === 'lg'"
      [class.no-icon]="!icon"
      [class.has-icon-right]="true"
      [value]="value"
      [disabled]="disabled"
      [tabIndex]="tabIndex"
      [maxLength]="maxLength"
      [attr.readonly]="readonly || null"
      [attr.placeholder]="placeholder || null"
      [attr.autocomplete]="autocomplete"
      [attr.autocorrect]="autocorrect"
      [attr.spellcheck]="spellcheck"
      [attr.lang]="lang"
      [attr.autocapitalize]="autocapitalize"
      [attr.pattern]="pattern || null"
      (keydown.enter)="onKeyEnter($event)"
      (input)="filterInput($event.target)"
      (blur)="onBlur($event.target)"
      (paste)="onPaste($event, $event.target)"
    />
    <span class="icon-wrapper">
      <i
        [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"
        class="icon-right btn-icon"
        title="Toggle password visibility"
        (click)="togglePassword()"
      ></i>
    </span>
    @if (!isValid && invalidFeedback && value) {
      <div class="invalid-feedback d-block">{{ invalidFeedback }}</div>
    }
  } @else {
    <div>********</div>
  }
</span>
